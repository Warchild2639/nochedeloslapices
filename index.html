<header><div class="lapiz" aria-hidden="true"></div><h1>La Noche de los Lápices</h1><p class="fecha">16 DE SEPTIEMBRE DE 1976</p><p class="bajada">Memoria, Verdad y Justicia. Un proyecto educativo de la Escuela de Educación Secundaria Nº 6.</p></header>
<main class="container" id="contenido"></main>
<footer><strong>Los lápices siguen escribiendo · Nunca Más</strong><small>Escuela de Educación Secundaria Nº 6 · Arte y Comunicación</small><small>© 2026 · Proyecto educativo de memoria colectiva</small></footer>
<div class="modal" id="modal" role="dialog" aria-label="Fotografía ampliada" onclick="this.style.display='none'"><img id="ampliada" alt="Fotografía histórica ampliada"></div>
<script>
const secciones=[
{titulo:'Contexto histórico',carpeta:'contexto',texto:'En septiembre de 1976, la Argentina atravesaba los primeros meses de la última dictadura cívico-militar, iniciada el 24 de marzo. El terrorismo de Estado persiguió a personas por sus actividades políticas, sindicales y sociales. También alcanzó a adolescentes que participaban en centros de estudiantes y organizaciones juveniles. La ciudad de La Plata, con una importante vida universitaria y estudiantil, fue uno de los escenarios de esa represión.',frases:['Memoria, Verdad y Justicia','La memoria es colectiva']},
{titulo:'La lucha estudiantil y el boleto',carpeta:'boleto',texto:'En 1975, estudiantes secundarios de La Plata participaron en movilizaciones por el boleto estudiantil secundario, una reivindicación vinculada con el acceso a la educación. Esa lucha es parte de la memoria de La Noche de los Lápices, pero los secuestros de 1976 deben comprenderse dentro de una persecución política más amplia contra la militancia juvenil. Reducir los hechos exclusivamente al reclamo del boleto dejaría afuera una parte fundamental de su contexto.',frases:['El derecho a estudiar','La participación estudiantil importa']},
{titulo:'La noche del 16 de septiembre',carpeta:'secuestros',texto:'Durante la noche del 16 de septiembre de 1976 y en días cercanos, fuerzas represivas secuestraron a estudiantes secundarios de La Plata. Muchos fueron llevados a centros clandestinos de detención, donde sufrieron torturas y desaparición forzada. La expresión «La Noche de los Lápices» se convirtió en un símbolo de estos crímenes y de la represión contra la juventud. No todos los secuestros ocurrieron en una única noche.',frases:['16 de septiembre de 1976','Nunca Más']},
{titulo:'Los estudiantes: nombres e historias',carpeta:'estudiantes',texto:'Entre los jóvenes desaparecidos se encuentran Claudia Falcone, María Clara Ciocchini, Francisco López Muntaner, Horacio Ungaro, Daniel Racero y Claudio de Acha. Tenían proyectos, amistades, familias e intereses propios, además de sus compromisos políticos. Recordar sus nombres permite recuperar sus identidades y evitar que sus vidas queden reducidas a una cifra o a una fecha.',frases:['No son números, son historias','Presentes en la memoria']},
{titulo:'Sobrevivientes, testimonios y justicia',carpeta:'testimonios',texto:'Los testimonios de sobrevivientes, entre ellos Pablo Díaz y Emilce Moler, contribuyeron a reconstruir los secuestros, los lugares de cautiverio y el funcionamiento del aparato represivo. Las investigaciones históricas y los procesos judiciales permiten contrastar relatos y comprender mejor lo sucedido. Escuchar esas voces es una herramienta central para la enseñanza de los derechos humanos.',frases:['Escuchar para comprender','Verdad y Justicia']},
{titulo:'Los lápices siguen escribiendo',carpeta:'memoria',texto:'Cada 16 de septiembre, el Día de los Derechos de los Estudiantes Secundarios en la provincia de Buenos Aires invita a reflexionar sobre la participación juvenil, la democracia y el derecho a la educación. Desde el arte y la comunicación, una escuela puede preservar la memoria mediante imágenes, palabras, testimonios y producciones colectivas. Recordar no es repetir una consigna: es formular preguntas, investigar y transmitir responsablemente la historia.',frases:['Los lápices siguen escribiendo','Educación, memoria y democracia']}
];
const videos=[["0gKLpuGrlZA","Contexto y militancia estudiantil — Pablo Díaz · Educación BA"],["lFjpCBRJtSc","El boleto y los derechos estudiantiles — UNLP TV"],["LHA7J9qADPk","Los secuestros y el terrorismo de Estado — Pablo Díaz · La Retaguardia"],["rn9BVBncapU","Día de los Derechos de los Estudiantes Secundarios — Ministerio de Cultura"],["TSPNVDbB5dw","Testimonio judicial de Emilce Moler — La Retaguardia"],["fRiYgNWLfG0","Memoria y juventudes — Emilce Moler · Radio Caput"]];const main=document.getElementById('contenido');const estados={};
secciones.forEach((s,i)=>{const id='track'+(i+1);estados[id]=0;const a=document.createElement('article');a.className='card';const doble=(s.frases.join(' • ')+' • ').repeat(8);a.innerHTML='<h2>'+s.titulo+'</h2><p class="texto">'+s.texto+'</p><div class="carousel"><button class="nav" aria-label="Fotos anteriores" data-dir="-1">❮</button><div class="ventana"><div class="pista" id="'+id+'"></div></div><button class="nav" aria-label="Fotos siguientes" data-dir="1">❯</button></div><a class="recurso" target="_blank" rel="noopener noreferrer" href="https://www.argentina.gob.ar/derechoshumanos">CONSULTAR RECURSOS DE DERECHOS HUMANOS</a><div class="cinta"><span>'+doble+doble+'</span></div>';main.appendChild(a);const pista=a.querySelector('.pista');let cargadas=0;for(let n=1;n<=12;n++){const img=new Image();img.src=s.carpeta+'/'+n+'.jpg';img.alt=s.titulo+' — fotografía '+n;img.className='foto';img.loading='lazy';img.onload=()=>{cargadas++;aviso.remove()};img.onerror=()=>img.remove();img.onclick=()=>{document.getElementById('ampliada').src=img.src;document.getElementById('modal').style.display='flex'};pista.appendChild(img)}const aviso=document.createElement('div');aviso.className='sin-fotos';aviso.textContent='Galería preparada para incorporar fotografías históricas documentadas.';pista.appendChild(aviso);a.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{const ventana=a.querySelector('.ventana');const fotos=[...pista.querySelectorAll('.foto')].filter(x=>x.complete&&x.naturalWidth);if(!fotos.length)return;const paso=fotos[0].getBoundingClientRect().width+15;const max=Math.max(0,pista.scrollWidth-ventana.clientWidth);estados[id]=Math.max(0,Math.min(max,estados[id]+Number(b.dataset.dir)*Math.max(1,Math.floor(ventana.clientWidth/paso))*paso));pista.style.transform='translateX(-'+estados[id]+'px)'});});
if('IntersectionObserver'in window){const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll('.card').forEach(c=>obs.observe(c))}else document.querySelectorAll('.card').forEach(c=>c.classList.add('visible'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').style.display='none'});
</script></body></html>
